<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <!-- Gradients for cinematic lighting -->
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#4facfe" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="hologramGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>

    <linearGradient id="aiBrain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <style>
      .bg { fill: #0d1117; }
      
      @keyframes floatHolo {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-4px) scale(1.02); }
      }
      @keyframes pulseNode {
        0%, 100% { opacity: 0.4; r: 2px; }
        50% { opacity: 1; r: 3.2px; filter: drop-shadow(0 0 3px #00f2fe); }
      }
      @keyframes pulsePurple {
        0%, 100% { opacity: 0.3; r: 2px; }
        50% { opacity: 0.95; r: 3px; filter: drop-shadow(0 0 4px #c084fc); }
      }
      @keyframes pulseLink {
        0%, 100% { stroke-opacity: 0.2; }
        50% { stroke-opacity: 0.8; }
      }
      @keyframes codeScroll {
        0% { transform: translateY(0); }
        100% { transform: translateY(-16px); }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes ledBlink1 {
        0%, 100% { fill: #22c55e; }
        50% { fill: #15803d; }
      }
      @keyframes ledBlink2 {
        0%, 100% { fill: #38bdf8; }
        30% { fill: #0369a1; }
      }
      @keyframes handTypingL {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-1.5px); }
      }
      @keyframes handTypingR {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(1.5px); }
      }
      @keyframes steamRise {
        0% { opacity: 0; transform: translateY(0) scaleX(1); }
        50% { opacity: 0.6; transform: translateY(-3px) scaleX(1.3); }
        100% { opacity: 0; transform: translateY(-7px) scaleX(1.6); }
      }

      .holo-group { animation: floatHolo 4s ease-in-out infinite; transform-origin: center; }
      .n1 { animation: pulseNode 2.2s infinite ease-in-out; }
      .n2 { animation: pulsePurple 1.8s infinite ease-in-out 0.4s; }
      .n3 { animation: pulseNode 2.6s infinite ease-in-out 0.8s; }
      .n4 { animation: pulsePurple 2.1s infinite ease-in-out 1.2s; }
      .link-pulse { animation: pulseLink 2s infinite ease-in-out; }
      .cursor { animation: blinkCursor 0.9s infinite; }
      .led1 { animation: ledBlink1 0.7s infinite ease-in-out; }
      .led2 { animation: ledBlink2 1.1s infinite ease-in-out; }
      .type-l { animation: handTypingL 0.28s steps(1) infinite; }
      .type-r { animation: handTypingR 0.28s steps(1) infinite 0.14s; }
      .steam { animation: steamRise 2.2s infinite ease-out; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="320" height="220" class="bg" rx="12" />

  <!-- Ambient Cinematic Glows -->
  <ellipse cx="140" cy="120" rx="90" ry="70" fill="url(#screenGlow)" />
  <ellipse cx="235" cy="75" rx="60" ry="50" fill="url(#hologramGlow)" />

  <!-- Architectural Background: Server Rack / Node Cluster (Far Right) -->
  <g opacity="0.85">
    <rect x="270" y="45" width="38" height="135" fill="#161b22" rx="3" stroke="#30363d" stroke-width="1" />
    <line x1="270" y1="72" x2="308" y2="72" stroke="#21262d" />
    <line x1="270" y1="99" x2="308" y2="99" stroke="#21262d" />
    <line x1="270" y1="126" x2="308" y2="126" stroke="#21262d" />
    <line x1="270" y1="153" x2="308" y2="153" stroke="#21262d" />
    <!-- Server Status LEDs (Vector Indexer / Inference cluster) -->
    <circle cx="276" cy="58" r="1.5" class="led1" />
    <circle cx="282" cy="58" r="1.5" class="led2" />
    <circle cx="288" cy="58" r="1.5" fill="#64748b" />
    
    <circle cx="276" cy="85" r="1.5" class="led2" />
    <circle cx="282" cy="85" r="1.5" class="led1" />
    
    <circle cx="276" cy="112" r="1.5" class="led1" />
    <circle cx="282" cy="112" r="1.5" class="led2" />
    
    <circle cx="276" cy="139" r="1.5" fill="#38bdf8" />
    <circle cx="282" cy="139" r="1.5" class="led1" />

    <!-- Server ventilation grid lines -->
    <line x1="294" y1="83" x2="304" y2="83" stroke="#30363d" stroke-width="1.5" stroke-dasharray="1.5,1.5" />
    <line x1="294" y1="110" x2="304" y2="110" stroke="#30363d" stroke-width="1.5" stroke-dasharray="1.5,1.5" />
    <line x1="294" y1="137" x2="304" y2="137" stroke="#30363d" stroke-width="1.5" stroke-dasharray="1.5,1.5" />
  </g>

  <!-- Left Window / Distant Grid Skyline -->
  <g opacity="0.6">
    <rect x="16" y="25" width="55" height="85" fill="#0d1117" stroke="#21262d" stroke-width="1" rx="2" />
    <!-- Constellation / Star Points -->
    <circle cx="32" cy="40" r="0.8" fill="#58a6ff" />
    <circle cx="48" cy="35" r="1" fill="#79c0ff" opacity="0.8" />
    <circle cx="60" cy="50" r="0.7" fill="#c9d1d9" />
    <circle cx="28" cy="70" r="0.9" fill="#58a6ff" opacity="0.7" />
    <circle cx="54" cy="80" r="1.1" fill="#38bdf8" />
    <!-- City grid wireframe -->
    <line x1="20" y1="95" x2="35" y2="80" stroke="#1f2937" stroke-width="0.7" />
    <line x1="35" y1="80" x2="55" y2="90" stroke="#1f2937" stroke-width="0.7" />
    <line x1="16" y1="75" x2="71" y2="75" stroke="#161b22" stroke-width="1" />
  </g>

  <!-- Desk Surface & Structure -->
  <rect x="25" y="155" width="235" height="5" fill="#21262d" rx="2" />
  <rect x="35" y="160" width="215" height="3" fill="#161b22" />
  <rect x="42" y="163" width="6" height="48" fill="#161b22" />
  <rect x="236" y="163" width="6" height="48" fill="#161b22" />

  <!-- Ambient Underglow beneath desk -->
  <line x1="50" y1="160" x2="230" y2="160" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="2" />

  <!-- Coffee Mug + Animated Steam -->
  <rect x="48" y="145" width="8" height="10" fill="#30363d" rx="1.5" />
  <path d="M 56 148 Q 59 150 56 153" stroke="#30363d" stroke-width="1.2" fill="none" />
  <path d="M 52 142 Q 50 139 53 136" stroke="#38bdf8" stroke-width="1" fill="none" class="steam" />

  <!-- MAIN DUAL SCREEN WORKSTATION -->
  
  <!-- Left Screen (Code / Terminal / Vector Query) -->
  <rect x="70" y="96" width="68" height="52" fill="#0b0f17" rx="3" stroke="#30363d" stroke-width="1.2" />
  <rect x="72" y="98" width="64" height="6" fill="#161b22" />
  <circle cx="76" cy="101" r="1.2" fill="#ff5f56" />
  <circle cx="80" cy="101" r="1.2" fill="#ffbd2e" />
  <circle cx="84" cy="101" r="1.2" fill="#27c93f" />
  
  <!-- Terminal Text Stream (RAG & Embedding inference) -->
  <g opacity="0.9">
    <rect x="75" y="108" width="24" height="2" fill="#38bdf8" />
    <rect x="101" y="108" width="18" height="2" fill="#a855f7" />
    
    <rect x="75" y="113" width="12" height="2" fill="#64748b" />
    <rect x="89" y="113" width="34" height="2" fill="#22c55e" />
    
    <rect x="75" y="118" width="40" height="2" fill="#f1f5f9" />
    
    <rect x="75" y="123" width="20" height="2" fill="#00f2fe" />
    <rect x="97" y="123" width="15" height="2" fill="#e2e8f0" />
    
    <rect x="75" y="128" width="28" height="2" fill="#64748b" />
    
    <rect x="75" y="133" width="18" height="2" fill="#38bdf8" />
    <rect x="95" y="133" width="3" height="3" fill="#00f2fe" class="cursor" />
  </g>
  <!-- Left Monitor Stand -->
  <rect x="101" y="148" width="6" height="8" fill="#21262d" />
  <rect x="94" y="154" width="20" height="2" fill="#30363d" rx="1" />

  <!-- Right Screen (Architecture & Latency Monitor) -->
  <rect x="144" y="90" width="58" height="58" fill="#0b0f17" rx="3" stroke="#30363d" stroke-width="1.2" />
  <rect x="146" y="92" width="54" height="6" fill="#161b22" />
  <!-- Graph Visualization on Right Screen -->
  <polyline points="150,132 158,124 166,128 174,115 182,122 190,108 196,112" fill="none" stroke="#00f2fe" stroke-width="1.5" />
  <line x1="150" y1="138" x2="196" y2="138" stroke="#1e293b" stroke-width="1" />
  <rect x="150" y="140" width="12" height="3" fill="#6366f1" rx="1" />
  <rect x="165" y="140" width="18" height="3" fill="#22c55e" rx="1" />
  <!-- Right Monitor Stand -->
  <rect x="170" y="148" width="6" height="8" fill="#21262d" />
  <rect x="163" y="154" width="20" height="2" fill="#30363d" rx="1" />

  <!-- FLOATING HOLOGRAPHIC RAG / NEURAL KNOWLEDGE GRAPH (ABOVE MONITORS) -->
  <g class="holo-group">
    <!-- Hologram emitter beam lines -->
    <line x1="173" y1="90" x2="200" y2="48" stroke="#a855f7" stroke-width="0.6" stroke-dasharray="2,2" opacity="0.4" />
    <line x1="173" y1="90" x2="235" y2="35" stroke="#00f2fe" stroke-width="0.6" stroke-dasharray="2,2" opacity="0.4" />
    
    <!-- Connected Neural Links -->
    <line x1="200" y1="48" x2="225" y2="32" stroke="#00f2fe" stroke-width="1" class="link-pulse" />
    <line x1="225" y1="32" x2="250" y2="42" stroke="#a855f7" stroke-width="1" class="link-pulse" />
    <line x1="200" y1="48" x2="218" y2="64" stroke="#6366f1" stroke-width="1" class="link-pulse" />
    <line x1="218" y1="64" x2="250" y2="42" stroke="#00f2fe" stroke-width="1" class="link-pulse" />
    <line x1="225" y1="32" x2="218" y2="64" stroke="#ec4899" stroke-width="0.8" stroke-dasharray="1.5,1.5" />
    <line x1="250" y1="42" x2="265" y2="60" stroke="#38bdf8" stroke-width="1" class="link-pulse" />

    <!-- Pulsing Neural Nodes (Vector Embeddings) -->
    <circle cx="200" cy="48" class="n1" fill="#00f2fe" />
    <circle cx="225" cy="32" class="n2" fill="#c084fc" />
    <circle cx="250" cy="42" class="n3" fill="#38bdf8" />
    <circle cx="218" cy="64" class="n4" fill="#ec4899" />
    <circle cx="265" cy="60" class="n1" fill="#00f2fe" />

    <!-- Subtle Hologram Tag -->
    <rect x="228" y="16" width="36" height="9" fill="#0f172a" rx="2" stroke="#6366f1" stroke-width="0.8" opacity="0.9" />
    <text x="232" y="23" fill="#38bdf8" font-family="monospace" font-size="5" font-weight="bold">RAG://VEC</text>
  </g>

  <!-- Ergonomic High-End Mesh Chair -->
  <path d="M 120 135 C 120 120 144 120 144 135 L 142 165 C 142 170 122 170 122 165 Z" fill="#1c2128" stroke="#30363d" stroke-width="1" />
  <rect x="127" y="122" width="10" height="4" fill="#38bdf8" opacity="0.5" rx="1" /> <!-- Headrest LED Accent -->

  <!-- Mechanical Keyboard -->
  <rect x="110" y="152" width="45" height="4" fill="#161b22" rx="1" stroke="#30363d" stroke-width="0.8" />
  <line x1="112" y1="154" x2="153" y2="154" stroke="#00f2fe" stroke-width="0.7" stroke-opacity="0.6" />

  <!-- Engineer Silhouette (Dark Hoodie + Glowing Headset) -->
  <!-- Head -->
  <ellipse cx="132" cy="130" rx="8.5" ry="9.5" fill="#0f141c" />
  <!-- Sleek Cyber Headset with Cyan LED Accent -->
  <path d="M 123 129 C 123 120 141 120 141 129" stroke="#38bdf8" stroke-width="1.8" fill="none" />
  <rect x="122.5" y="128" width="2.5" height="5" fill="#00f2fe" rx="1" filter="drop-shadow(0 0 2px #00f2fe)" />
  <rect x="139" y="128" width="2.5" height="5" fill="#00f2fe" rx="1" filter="drop-shadow(0 0 2px #00f2fe)" />
  
  <!-- Shoulders & Torso -->
  <path d="M 115 145 C 115 137 149 137 149 145 L 147 165 L 117 165 Z" fill="#161b22" />

  <!-- Hands Typing with subtle stepping animation -->
  <g class="type-l">
    <rect x="117" y="150" width="6" height="3" fill="#334155" rx="1" />
    <rect x="119" y="152" width="3" height="2" fill="#94a3b8" />
  </g>
  <g class="type-r">
    <rect x="141" y="150" width="6" height="3" fill="#334155" rx="1" />
    <rect x="142" y="152" width="3" height="2" fill="#94a3b8" />
  </g>
</svg>
