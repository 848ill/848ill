<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="240" height="240" shape-rendering="crispEdges">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .desk { fill: #161b22; }
      .desk-top { fill: #21262d; }
      .monitor-frame { fill: #30363d; }
      .screen-bg { fill: #090d13; }
      .chair { fill: #1c2128; }
      .body { fill: #2d333b; }
      .skin { fill: #c9d1d9; }
      .hair { fill: #161b22; }
      
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes screenPulse {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; }
      }
      @keyframes typingLeft {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-1px); }
      }
      @keyframes typingRight {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(1px); }
      }
      @keyframes steamFloat {
        0% { opacity: 0; transform: translateY(0); }
        50% { opacity: 0.7; transform: translateY(-2px); }
        100% { opacity: 0; transform: translateY(-4px); }
      }

      .cursor { animation: cursorBlink 1s infinite; }
      .glow { animation: screenPulse 3s ease-in-out infinite; }
      .hand-l { animation: typingLeft 0.35s steps(1) infinite; }
      .hand-r { animation: typingRight 0.35s steps(1) infinite; }
      .steam { animation: steamFloat 2s ease-out infinite; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="120" height="120" class="bg" rx="8" />

  <!-- Ambient City Window -->
  <rect x="8" y="10" width="30" height="40" fill="#161b22" />
  <rect x="9" y="11" width="28" height="38" fill="#0b0e14" />
  <rect x="14" y="20" width="1" height="1" fill="#30363d" />
  <rect x="22" y="16" width="1" height="1" fill="#58a6ff" opacity="0.6" />
  <rect x="28" y="26" width="1" height="1" fill="#30363d" />
  <rect x="18" y="34" width="2" height="1" fill="#58a6ff" opacity="0.4" />
  <rect x="22" y="11" width="1" height="38" fill="#161b22" />
  <rect x="9" y="30" width="28" height="1" fill="#161b22" />

  <!-- Desk Structure -->
  <rect x="10" y="82" width="100" height="3" class="desk-top" />
  <rect x="14" y="85" width="92" height="2" class="desk" />
  <rect x="18" y="87" width="4" height="30" class="desk" />
  <rect x="98" y="87" width="4" height="30" class="desk" />

  <!-- Steaming Espresso Mug -->
  <rect x="20" y="76" width="5" height="6" fill="#30363d" />
  <rect x="19" y="78" width="1" height="3" fill="#21262d" />
  <rect x="22" y="74" width="1" height="2" fill="#58a6ff" class="steam" />

  <!-- Primary Monitor (Center) -->
  <rect x="36" y="52" width="32" height="24" class="monitor-frame" />
  <rect x="38" y="54" width="28" height="20" class="screen-bg" />
  <rect x="50" y="76" width="4" height="6" class="monitor-frame" />
  <rect x="46" y="81" width="12" height="1" class="monitor-frame" />

  <!-- Code on Primary Screen -->
  <g class="glow">
    <rect x="40" y="56" width="8" height="1" fill="#79c0ff" />
    <rect x="40" y="58" width="14" height="1" fill="#a5d6ff" />
    <rect x="42" y="60" width="12" height="1" fill="#58a6ff" />
    <rect x="42" y="62" width="18" height="1" fill="#7ee787" />
    <rect x="44" y="64" width="10" height="1" fill="#ffa657" />
    <rect x="42" y="66" width="8" height="1" fill="#79c0ff" />
    <rect x="40" y="68" width="16" height="1" fill="#d2a8ff" />
    <rect x="40" y="70" width="6" height="1" fill="#79c0ff" />
    <rect x="47" y="70" width="2" height="1" fill="#58a6ff" class="cursor" />
  </g>

  <!-- Secondary Vertical Monitor (Right) -->
  <rect x="72" y="46" width="18" height="30" class="monitor-frame" />
  <rect x="74" y="48" width="14" height="26" class="screen-bg" />
  <rect x="79" y="76" width="4" height="6" class="monitor-frame" />
  <rect x="76" y="81" width="10" height="1" class="monitor-frame" />
  <rect x="76" y="50" width="10" height="1" fill="#ff7b72" opacity="0.8" />
  <rect x="76" y="53" width="7" height="1" fill="#7ee787" opacity="0.8" />
  <rect x="76" y="56" width="11" height="1" fill="#79c0ff" opacity="0.8" />
  <rect x="76" y="62" width="2" height="8" fill="#30363d" />
  <rect x="79" y="65" width="2" height="5" fill="#58a6ff" opacity="0.8" />
  <rect x="82" y="60" width="2" height="10" fill="#7ee787" opacity="0.8" />
  <rect x="85" y="64" width="2" height="6" fill="#ffa657" opacity="0.8" />

  <!-- Keyboard -->
  <rect x="48" y="80" width="22" height="2" fill="#21262d" />
  <rect x="49" y="79" width="20" height="1" fill="#30363d" />

  <!-- Chair & Developer Body -->
  <rect x="52" y="66" width="16" height="24" class="chair" rx="2" />
  <rect x="55" y="62" width="10" height="4" fill="#30363d" rx="1" />
  <rect x="55" y="56" width="10" height="10" class="hair" />
  
  <!-- Glowing Cyber Headphone -->
  <rect x="54" y="57" width="1" height="8" fill="#58a6ff" />
  <rect x="65" y="57" width="1" height="8" fill="#58a6ff" />
  <rect x="55" y="55" width="10" height="1" fill="#58a6ff" />

  <rect x="57" y="66" width="6" height="2" class="body" />
  <rect x="53" y="68" width="14" height="14" class="body" />
  <rect x="51" y="72" width="2" height="8" class="body" />
  <rect x="67" y="72" width="2" height="8" class="body" />

  <!-- Animated Typing Hands -->
  <g class="hand-l">
    <rect x="50" y="76" width="3" height="4" class="body" />
    <rect x="51" y="79" width="3" height="2" class="skin" />
  </g>
  <g class="hand-r">
    <rect x="66" y="76" width="3" height="4" class="body" />
    <rect x="64" y="79" width="3" height="2" class="skin" />
  </g>

  <!-- Ambient Underglow -->
  <rect x="25" y="116" width="70" height="1" fill="#58a6ff" opacity="0.3" />
</svg>
